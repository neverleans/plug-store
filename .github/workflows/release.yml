name: Release to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-core:
    name: Publish @neverleans-labs/plug-store-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Publish core package
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "No NPM_TOKEN found, removing .npmrc to use OIDC Trusted Publishing"
            rm -f ~/.npmrc
          fi
          npm publish --access public --provenance
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    name: Publish create-plug-store
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter create-plug-store

      - name: Publish CLI package
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "No NPM_TOKEN found, removing .npmrc to use OIDC Trusted Publishing"
            rm -f ~/.npmrc
          fi
          npm publish --access public --provenance
        working-directory: packages/create-plug-store
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
