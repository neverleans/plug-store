name: Release to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

# Publishing is idempotent: each job skips a version that is already on the
# registry, so this workflow can be re-run against an existing tag to fill in a
# package that did not make it, without EPUBLISHCONFLICT killing the run.
jobs:
  publish-core:
    name: Publish @neverleans-labs/plug-store-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Publish core package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@neverleans-labs/plug-store-core@${VERSION}" version > /dev/null 2>&1; then
            echo "core ${VERSION} is already published, skipping"
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "No NPM_TOKEN found, removing .npmrc to use OIDC Trusted Publishing"
            rm -f ~/.npmrc
          fi
          npm publish --access public --provenance
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # This job did not exist until 0.1.2, which is why themes sat at 0.1.0 while
  # core shipped 0.1.0, 0.1.1 and 0.1.2. The CLI pins both packages at its own
  # version, so a missing themes release makes `npm create plug-store` fail with
  # E404 on install — the scaffold is broken by a gap in this file, not in code.
  publish-themes:
    name: Publish @neverleans-labs/plug-store-themes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build --filter='!plug-store-docs'

      - name: Publish themes package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@neverleans-labs/plug-store-themes@${VERSION}" version > /dev/null 2>&1; then
            echo "themes ${VERSION} is already published, skipping"
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "No NPM_TOKEN found, removing .npmrc to use OIDC Trusted Publishing"
            rm -f ~/.npmrc
          fi
          npm publish --access public --provenance
        working-directory: packages/themes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    name: Publish create-plug-store
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter create-plug-store

      - name: Publish CLI package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "create-plug-store@${VERSION}" version > /dev/null 2>&1; then
            echo "create-plug-store ${VERSION} is already published, skipping"
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "No NPM_TOKEN found, removing .npmrc to use OIDC Trusted Publishing"
            rm -f ~/.npmrc
          fi
          npm publish --access public --provenance
        working-directory: packages/create-plug-store
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The release reported success while themes was missing, because nothing ever
  # asked the registry what it actually had. The CLI writes its own version as
  # the range for both library packages, so anything less than all three at the
  # tag version is a broken scaffold shipped to users.
  verify-release:
    name: Verify all three packages resolve
    runs-on: ubuntu-latest
    needs: [publish-core, publish-themes, publish-cli]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every package must be at the tagged version
        run: |
          EXPECTED=$(node -p "require('./packages/core/package.json').version")
          echo "expecting ${EXPECTED}"
          FAILED=0
          for PKG in "@neverleans-labs/plug-store-core" "@neverleans-labs/plug-store-themes" "create-plug-store"; do
            ACTUAL=$(npm view "${PKG}" version 2>/dev/null || echo "MISSING")
            if [ "${ACTUAL}" != "${EXPECTED}" ]; then
              echo "::error::${PKG} is at ${ACTUAL}, expected ${EXPECTED}"
              FAILED=1
            else
              echo "ok  ${PKG} ${ACTUAL}"
            fi
          done
          exit ${FAILED}

      - name: The range the CLI writes must resolve
        run: |
          EXPECTED=$(node -p "require('./packages/create-plug-store/package.json').version")
          for PKG in "@neverleans-labs/plug-store-core" "@neverleans-labs/plug-store-themes"; do
            npm view "${PKG}@^${EXPECTED}" version > /dev/null
            echo "ok  ${PKG}@^${EXPECTED} resolves"
          done
